; FO4SFPipboyMenu (FAL-187, FAL-216, FAL-272, FAL-301; README.md in this folder). Read once at load, next to the dll.
[FO4SFPipboyMenu]
; 0 = off (the plugin logs one line and stays idle), 1 = stage (a): the menu with no movie,
; 2 = stage (b): the menu showing Interface/FO4SF_PipboyMenu.swf from "FO4SFPipboyProbe - Main.ba2",
; 3 = stage (c): (b) plus the data channel (the movie staged with make_pipboy_probe.py stage --channel),
; 4 = stage (d): the STAT page (the movie staged with make_pipboy_probe.py stage --page)
; 5 = stage (e): the page kit, the pages in the [Kit] and [Page ...] sections below (the movie staged with
;     make_pipboy_probe.py stage --kit, from this file)
Stage=0
; the virtual-key code that opens and closes the menu (0x79 = F10)
Key=0x79
; stages (d) and (e), FAL-414: up to four keyboard ids that close the page while it is open and are not passed on to
; the game (Windows virtual-key codes: 0x1B = Esc, 0x09 = Tab; 0 = unused). The log's step=input line shows the id sent.
CancelCode1=0x1B
CancelCode2=0x09
CancelCode3=0
CancelCode4=0
; world surface (FAL-250; README "World surface"), with Stage=2: 0 = off (the log is #704's); 1 = the census of the
; engine's menus, and WorldKey sends show / hide to WorldMenu
World=0
; the key for WorldMenu (0x77 = F8); not the menu key
WorldKey=0x77
; one vanilla menu name from a step=census_registered line (letters, digits, _); empty = census only
WorldMenu=
; the twin's path that make_pipboy_probe.py twin staged (Interface/<file>), for the log only; empty = none
WorldMovie=
; extra IMenu flags OR'ed into the ones the engine's constructor set (0 = none)
Flags=0
; 1 = hold one extra reference on each menu object the plugin creates (the count a public precedent uses, and the
; one the engine expects). 0 is refused at every stage (refuse step=ini reason=keep_alive): without that reference
; the game frees the menu at its create and then uses it
KeepAlive=1
; stage (c) only: up to four flag sets, one per open in turn (open k uses entry (k - 1) mod count), OR'ed like Flags.
; 0x0 = the constructor's own; 0x8 = libxse's ShowCursor (bit 3); 0x9 = ShowCursor + bit 0 (Fallout 4's
; "pauses game" bit; unverified in Starfield: the log's paused= says)
FlagSets=0x0,0x8,0x9
; stages (d) and (e): the flag sets of the page's opens, as FlagSets (0x9 = ShowCursor + bit 0: the set at which the
; FAL-216 clicks reached our menu; FlagSets is not read at stages (d) and (e))
PageFlagSets=0x19
; 0x19 = ShowCursor (0x8) + bit 0 + bit 4 (0x10). PC sweep of #738 at 14176a5e: bit 4 puts StopContextProcessing (78) on the
; control map's stack, which makes Tab and Esc arrive as Cancel; bit 1 (0x2) pauses the game; bit 8 (0x100) blanks the world.
; FAL-414 flag sweep (up to 16 sets, one per open, repeating): the game's menus get their input contexts (78 =
; StopContextProcessing and 2 = BasicMenuNav above the gameplay ones) from something; ShowCursor (0x8) is what added
; context 13. To find the flag: open and close the page once per entry, F11 after each open, and read the contexts= of
; each step=snapshot tag=main_after_open (the step=flags line before it names the set). libxse's IMenu::Flag bits:
; 0,1,3,4,6,8,9,10,18,25,27. Example, 0x9 plus each one in turn (bits 0 and 3 are already in 0x9):
; PageFlagSets=0x9,0xB,0x19,0x49,0x109,0x209,0x409,0x40009,0x2000009,0x8000009
; stages (d) and (e), the owner's setting (FAL-446): 0 = the game runs behind the Pip-Boy (as shipped); 1 = it pauses
; (adds bit 1, 0x2, to every PageFlagSets entry: the bit that paused the game in the PC's sweep at 14176a5e)
Pause=0
; stages (c) to (e): the key that logs a snapshot (pause state, open menus, input contexts) on the main thread
; (0x7A = F11; 0 = none)
SnapshotKey=0x7A
; stage (c) only (FAL-246): <script>.<function>, a global Papyrus function with no arguments that the plugin asks the
; script VM to run after each click on the movie's button (FOCC_B0.Click, the combined probe kit's, logs "b0 click"
; through its probe quest); empty = no call
ClickCall=

; stage (b) only, probe 1 (FAL-739; README "Probe 1"): 0 = off (as shipped: nothing of it runs or logs); 1 = the menu
; loads ProbeMovie instead of its own movie and shows it on a model in a menu scene (a vanilla data slate). It needs
; KeepAlive=1; the probe's scene goes when the game destroys its menu object, never at a close
Probe=0
; the privately staged movie, Interface/<ProbeMovie>.swf: FO4SF_ and letters, digits or _ (never a game menu's name)
ProbeMovie=
; the model: a vanilla data-slate book's Starfield.esm form id, in hex (the session card names it)
ProbeModelForm=
; the render texture's size: the staged movie's stage, 16 to 4096 each
ProbeWidth=1280
ProbeHeight=720

; stage (e) only: the kit's keys, up to three virtual-key codes each, read while the page is open and the game in
; front (Up/W, Down/S: the selection, held to repeat; Left/A, Right/D: the sub-tab; Q, E: the main tab). Not Key or
; SnapshotKey. 0x09 (Tab) may be added; what the game itself does with each key at PageFlagSets is the session's finding
KitUp=0x26,0x57
KitDown=0x28,0x53
KitPrevSub=0x25,0x41
KitNextSub=0x27,0x44
KitPrevTab=0x51
KitNextTab=0x45

; ---------------------------------------------------------------------------------------------- the kit's pages
; Stage (e) (FAL-301): every page of the kit, as data. Read by the plugin at load and by
; scripts/ui/make_pipboy_kit.py, which draws the main tabs from it (re-stage with --kit after a change). A page:
;   [Page <TAB>/<SUB>]       its main tab and sub-tab; main tabs come in the order of their first page (up to 5),
;                            sub-tabs in the order of their pages (up to 5 per tab)
;   Row=<label>|<value>      a list row and its value (any number up to 64; 16 on screen, scrolled), or
;   List=<list>              the rows from a list provider (kit_test, inventory, quests), or
;   Notice=<text>            a line of a placeholder page (up to 16)
;   Footer=<label>|<value>   a footer cell (up to 3); Hint=<text> the key hints on this page
; Values: health, level, xp, carry_max, rads, cell, world, time, days, position, or av:<hex> (an actor value by its
; form id: av:2C2 is Starfield.esm's Strength). Labels: upper case, the kit font's characters (A-Z 0-9 space and
; ! # % & ' ( ) * + , - . / : ; < = > ? [ ] _), at most 33 for a row, 9 for a tab, 13 for a sub-tab, 10 for a footer
; cell. A wrong line stops the kit: refuse step=pages line=<n> reason=<r>. [Kit] Mission=<plugin file>|<local id hex>:
; our mission, the first row of List=quests (FO4SFMission.esm's FO4SF_Min00 "When Freedom Calls" is local id 800).
; [Kit] MissionStageAt=<hex offset>: where the mission keeps its current stage (a u16, even, 38 to 336), the line
; scripts/ui/pipboy_quest_bytes.py prints from two F11 dumps; without it the quest's STAGE shows ? (FAL-527).
; [Kit] MissionObjective=<n>|<path>, up to 8 lines: objective <n>'s state, the byte at the end of <path> (2 or 3 hex
; offsets joined by /: a pointer read at each but the last), the line pipboy_quest_bytes.py --objective <n> prints;
; without any the page walks the mission's objectives itself (FAL-571; README, quests)
[Kit]
Title=FO4SF PIP-BOY
Header=time
Hints=[W/S] SELECT  [A/D] SUB-TAB  [Q/E] TAB  [F10] CLOSE
Mission=FO4SFMission.esm|800

[Page STAT/STATUS]
Row=HEALTH|health
Row=LEVEL|level
Row=EXPERIENCE|xp
Row=CARRY WEIGHT MAX|carry_max
Row=RADS|rads
Row=CELL|cell
Row=WORLD|world
Row=TIME|time
Footer=HP|health
Footer=LEVEL|level
Footer=XP|xp

[Page STAT/SPECIAL]
Row=STRENGTH|av:2C2
Row=PERCEPTION|av:2C3
Row=ENDURANCE|av:2C4
Row=CHARISMA|av:2C5
Row=INTELLIGENCE|av:2C6
Row=AGILITY|av:2C7
Row=LUCK|av:2C8
Footer=HP|health
Footer=LEVEL|level
Footer=XP|xp

[Page INV/ITEMS]
List=inventory

[Page DATA/QUESTS]
List=quests

[Page DATA/KIT TEST]
List=kit_test
Hint=[W/S] SCROLL 30 ROWS  [A/D] SUB-TAB  [Q/E] TAB  [F10] CLOSE

[Page MAP/WORLD]
Row=WORLD|world
Row=CELL|cell
Row=POSITION|position
Row=TIME|time
Row=DAYS PASSED|days

[Page RADIO/STATIONS]
Notice=THE RADIO WAITS FOR ITS TRACK:
Notice=STATIONS AND THEIR SOUND
