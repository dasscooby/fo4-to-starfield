; FO4SFPipboyMenu (FAL-187; README.md in this folder). Read once at load, next to the dll.
[FO4SFPipboyMenu]
; 0 = off (the plugin logs one line and stays idle), 1 = stage (a): the menu with no movie,
; 2 = stage (b): the menu showing Interface/FO4SF_PipboyMenu.swf from "FO4SFPipboyProbe - Main.ba2"
Stage=0
; the virtual-key code that opens and closes the menu (0x79 = F10)
Key=0x79
; extra IMenu flags OR'ed into the ones the engine's constructor set (0 = none)
Flags=0
; 1 = hold one extra reference on each menu object the plugin creates, so the engine never frees it
; (the count a public precedent uses); 0 = the engine's own count only
KeepAlive=1
